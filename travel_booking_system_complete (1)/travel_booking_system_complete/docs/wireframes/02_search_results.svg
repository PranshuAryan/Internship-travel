<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="620" fill="#ffffff" stroke="#999"/>
  <rect x="0" y="0" width="800" height="56" fill="#f4f4f4" stroke="#bbb"/>
  <rect x="24" y="18" width="90" height="20" fill="#ccc"/>
  <rect x="640" y="18" width="60" height="20" fill="#ddd"/>
  <rect x="710" y="16" width="70" height="24" rx="12" fill="#bbb"/>

  <!-- filter toggle -->
  <rect x="60" y="80" width="70" height="26" rx="13" fill="#999"/>
  <rect x="140" y="80" width="70" height="26" rx="13" fill="none" stroke="#bbb"/>
  <rect x="220" y="80" width="70" height="26" rx="13" fill="none" stroke="#bbb"/>
  <rect x="300" y="80" width="50" height="26" rx="13" fill="none" stroke="#bbb"/>

  <!-- search bar (compact) -->
  <rect x="60" y="120" width="680" height="50" rx="25" fill="#fff" stroke="#999" stroke-width="2"/>
  <line x1="220" y1="128" x2="220" y2="162" stroke="#ddd"/>
  <line x1="380" y1="128" x2="380" y2="162" stroke="#ddd"/>
  <line x1="540" y1="128" x2="540" y2="162" stroke="#ddd"/>
  <text x="80" y="150" font-size="12" fill="#777">From</text>
  <text x="240" y="150" font-size="12" fill="#777">To</text>
  <text x="400" y="150" font-size="12" fill="#777">Depart</text>
  <rect x="640" y="128" width="80" height="34" rx="17" fill="#999"/>
  <text x="655" y="150" font-size="12" fill="#fff">Search</text>

  <!-- results heading + sort -->
  <rect x="60" y="200" width="200" height="20" fill="#ccc"/>
  <text x="600" y="215" font-size="11" fill="#999">Sort: [Price] [Departure]</text>

  <!-- result rows -->
  <g>
    <rect x="60" y="240" width="680" height="1" fill="#ddd"/>

    <rect x="60" y="252" width="55" height="18" rx="4" fill="#e9e9e9"/>
    <text x="130" y="266" font-size="13" fill="#444">New York -------- London</text>
    <text x="500" y="266" font-size="11" fill="#888">Sep 14 09:20 · 41 seats left</text>
    <text x="700" y="266" font-size="13" fill="#333">$450</text>
    <rect x="60" y="284" width="680" height="1" fill="#ddd"/>

    <rect x="60" y="296" width="55" height="18" rx="4" fill="#e9e9e9"/>
    <text x="130" y="310" font-size="13" fill="#444">New York -------- Paris</text>
    <text x="500" y="310" font-size="11" fill="#888">Sep 17 07:45 · 50 seats left</text>
    <text x="700" y="310" font-size="13" fill="#333">$520</text>
    <rect x="60" y="328" width="680" height="1" fill="#ddd"/>

    <rect x="60" y="340" width="55" height="18" rx="4" fill="#e9e9e9"/>
    <text x="130" y="354" font-size="13" fill="#444">San Francisco -------- Tokyo</text>
    <text x="500" y="354" font-size="11" fill="#888">Sep 20 11:10 · 50 seats left</text>
    <text x="700" y="354" font-size="13" fill="#333">$780</text>
    <rect x="60" y="372" width="680" height="1" fill="#ddd"/>

    <rect x="60" y="384" width="55" height="18" rx="4" fill="#e9e9e9"/>
    <text x="130" y="398" font-size="13" fill="#444">Grand Plaza -------- London</text>
    <text x="500" y="398" font-size="11" fill="#888">Sep 14 · $ / night</text>
    <text x="700" y="398" font-size="13" fill="#333">$120</text>
    <rect x="60" y="416" width="680" height="1" fill="#ddd"/>
  </g>

  <text x="20" y="612" font-size="11" fill="#bbb">Wireframe: Search Results page</text>
</svg>
