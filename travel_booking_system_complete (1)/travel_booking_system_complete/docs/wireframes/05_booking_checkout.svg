<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="620" fill="#ffffff" stroke="#999"/>
  <rect x="0" y="0" width="800" height="56" fill="#f4f4f4" stroke="#bbb"/>
  <rect x="24" y="18" width="90" height="20" fill="#ccc"/>

  <!-- trip summary card -->
  <rect x="60" y="100" width="320" height="380" rx="8" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <rect x="88" y="128" width="60" height="16" rx="4" fill="#e9e9e9"/>
  <rect x="88" y="156" width="220" height="22" fill="#ccc"/>
  <rect x="88" y="186" width="150" height="14" fill="#eee"/>

  <line x1="88" y1="216" x2="352" y2="216" stroke="#ddd"/>
  <text x="88" y="238" font-size="10" fill="#999">DEPARTS</text>
  <text x="88" y="256" font-size="12" fill="#444">14 Sep 2026, 09:20 AM</text>
  <text x="220" y="238" font-size="10" fill="#999">ARRIVES</text>
  <text x="220" y="256" font-size="12" fill="#444">14 Sep 2026, 04:20 PM</text>
  <line x1="88" y1="272" x2="352" y2="272" stroke="#ddd"/>

  <rect x="88" y="292" width="90" height="28" fill="#ccc"/>
  <text x="190" y="313" font-size="12" fill="#999">/ person</text>
  <text x="88" y="345" font-size="11" fill="#2e8b74">41 seats left</text>

  <!-- booking form card -->
  <rect x="420" y="100" width="320" height="380" rx="8" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <rect x="448" y="128" width="200" height="18" fill="#ccc"/>

  <text x="448" y="172" font-size="11" fill="#888">Number of travelers</text>
  <rect x="448" y="178" width="264" height="32" rx="4" fill="#f7f7f7" stroke="#ccc"/>

  <text x="448" y="228" font-size="11" fill="#888">Payment method</text>
  <rect x="448" y="234" width="264" height="32" rx="4" fill="#f7f7f7" stroke="#ccc"/>
  <text x="460" y="255" font-size="11" fill="#aaa">Credit / debit card (mock)</text>

  <line x1="448" y1="284" x2="712" y2="284" stroke="#ddd"/>
  <text x="448" y="308" font-size="12" fill="#888">Total</text>
  <text x="660" y="308" font-size="16" fill="#333">$450.00</text>

  <rect x="448" y="326" width="264" height="40" rx="20" fill="#999"/>
  <text x="540" y="350" font-size="13" fill="#fff">Confirm booking</text>

  <!-- confirmation state annotation -->
  <rect x="448" y="390" width="264" height="70" rx="6" fill="#fbfbfb" stroke="#ddd" stroke-dasharray="6,6"/>
  <text x="460" y="415" font-size="10" fill="#999">[ On success: checkmark + ]</text>
  <text x="460" y="430" font-size="10" fill="#999">booking ref + transaction ID +</text>
  <text x="460" y="445" font-size="10" fill="#999">"View my bookings" button ]</text>

  <text x="20" y="612" font-size="11" fill="#bbb">Wireframe: Booking / Checkout page</text>
</svg>
