<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="620" fill="#ffffff" stroke="#999" stroke-width="1"/>

  <!-- Nav bar -->
  <rect x="0" y="0" width="800" height="56" fill="#f4f4f4" stroke="#bbb"/>
  <rect x="24" y="18" width="90" height="20" fill="#ccc"/>
  <rect x="560" y="18" width="60" height="20" fill="#ddd"/>
  <rect x="640" y="18" width="60" height="20" fill="#ddd"/>
  <rect x="710" y="16" width="70" height="24" rx="12" fill="#bbb"/>

  <!-- Hero -->
  <line x1="60" y1="100" x2="360" y2="100" stroke="#999" stroke-width="6"/>
  <line x1="60" y1="100" x2="360" y2="100" stroke="#999" stroke-width="6" stroke-dasharray="2,10"/>
  <rect x="60" y="130" width="300" height="24" fill="#ccc"/>
  <rect x="60" y="164" width="220" height="24" fill="#ccc"/>
  <rect x="60" y="204" width="380" height="16" fill="#e5e5e5"/>
  <rect x="60" y="226" width="300" height="16" fill="#e5e5e5"/>

  <!-- trip type toggle -->
  <rect x="60" y="256" width="80" height="26" rx="13" fill="#999"/>
  <rect x="150" y="256" width="80" height="26" rx="13" fill="none" stroke="#bbb"/>
  <rect x="240" y="256" width="80" height="26" rx="13" fill="none" stroke="#bbb"/>

  <!-- search bar -->
  <rect x="60" y="296" width="470" height="60" rx="30" fill="#fff" stroke="#999" stroke-width="2"/>
  <line x1="175" y1="306" x2="175" y2="346" stroke="#ddd"/>
  <line x1="290" y1="306" x2="290" y2="346" stroke="#ddd"/>
  <line x1="380" y1="306" x2="380" y2="346" stroke="#ddd"/>
  <text x="80" y="320" font-size="10" fill="#888">FROM</text>
  <text x="80" y="338" font-size="12" fill="#555">New York</text>
  <text x="190" y="320" font-size="10" fill="#888">TO</text>
  <text x="190" y="338" font-size="12" fill="#555">London</text>
  <text x="305" y="320" font-size="10" fill="#888">DEPART</text>
  <text x="305" y="338" font-size="12" fill="#555">Sep 20</text>
  <rect x="440" y="304" width="76" height="44" rx="22" fill="#999"/>
  <text x="455" y="330" font-size="13" fill="#fff">Search</text>

  <!-- decorative route graphic placeholder -->
  <rect x="560" y="100" width="200" height="220" fill="none" stroke="#ccc" stroke-dasharray="6,6"/>
  <circle cx="590" cy="290" r="6" fill="#bbb"/>
  <circle cx="720" cy="150" r="6" fill="#bbb"/>
  <path d="M590 290 Q 660 150 720 150" fill="none" stroke="#ccc" stroke-dasharray="2,8"/>
  <text x="600" y="330" font-size="10" fill="#aaa">[ route illustration ]</text>

  <!-- trust strip -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#ddd"/>
  <text x="40" y="405" font-size="11" fill="#888">50,000+ trips</text>
  <text x="230" y="405" font-size="11" fill="#888">120 destinations</text>
  <text x="420" y="405" font-size="11" fill="#888">24/7 confirmation</text>
  <text x="610" y="405" font-size="11" fill="#888">Secure checkout</text>
  <line x1="0" y1="425" x2="800" y2="425" stroke="#ddd"/>

  <!-- popular routes list -->
  <rect x="60" y="450" width="200" height="18" fill="#ccc"/>
  <text x="620" y="463" font-size="12" fill="#999">Browse all →</text>

  <g>
    <rect x="60" y="480" width="680" height="1" fill="#ddd"/>
    <rect x="60" y="490" width="50" height="16" rx="4" fill="#e9e9e9"/>
    <text x="200" y="502" font-size="12" fill="#555">New York -------- London</text>
    <text x="560" y="502" font-size="12" fill="#888">Sep 14, 09:20</text>
    <text x="700" y="502" font-size="12" fill="#333">$450</text>
    <rect x="60" y="512" width="680" height="1" fill="#ddd"/>

    <rect x="60" y="522" width="50" height="16" rx="4" fill="#e9e9e9"/>
    <text x="200" y="534" font-size="12" fill="#555">Boston -------- New York</text>
    <text x="560" y="534" font-size="12" fill="#888">Sep 13, 06:30</text>
    <text x="700" y="534" font-size="12" fill="#333">$35</text>
    <rect x="60" y="544" width="680" height="1" fill="#ddd"/>
  </g>

  <!-- footer -->
  <rect x="0" y="576" width="800" height="44" fill="#f4f4f4"/>
  <text x="330" y="602" font-size="10" fill="#999">footer — links / copyright</text>

  <text x="20" y="612" font-size="11" fill="#bbb">Wireframe: Home / Landing page</text>
</svg>
