<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- USERS table -->
  <g>
    <rect x="40" y="40" width="220" height="180" fill="#fff" stroke="#13273F" stroke-width="1.5" rx="4"/>
    <rect x="40" y="40" width="220" height="30" fill="#13273F" rx="4"/>
    <text x="150" y="60" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">users</text>
    <text x="52" y="88" font-size="12" fill="#333">PK  id (Integer)</text>
    <text x="52" y="106" font-size="12" fill="#333">    name (String)</text>
    <text x="52" y="124" font-size="12" fill="#333">UQ  email (String)</text>
    <text x="52" y="142" font-size="12" fill="#333">    password_hash (String)</text>
    <text x="52" y="160" font-size="12" fill="#333">    phone (String)</text>
    <text x="52" y="178" font-size="12" fill="#333">    created_at (DateTime)</text>
  </g>

  <!-- TRIPS table -->
  <g>
    <rect x="620" y="40" width="240" height="216" fill="#fff" stroke="#2E6E6E" stroke-width="1.5" rx="4"/>
    <rect x="620" y="40" width="240" height="30" fill="#2E6E6E" rx="4"/>
    <text x="740" y="60" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">trips</text>
    <text x="632" y="88" font-size="12" fill="#333">PK  id (Integer)</text>
    <text x="632" y="106" font-size="12" fill="#333">    trip_type (String)</text>
    <text x="632" y="124" font-size="12" fill="#333">    provider (String)</text>
    <text x="632" y="142" font-size="12" fill="#333">    source (String)</text>
    <text x="632" y="160" font-size="12" fill="#333">    destination (String)</text>
    <text x="632" y="178" font-size="12" fill="#333">    departure_time (DateTime)</text>
    <text x="632" y="196" font-size="12" fill="#333">    arrival_time (DateTime)</text>
    <text x="632" y="214" font-size="12" fill="#333">    price (Float)</text>
    <text x="632" y="232" font-size="12" fill="#333">    seats_available (Integer)</text>
  </g>

  <!-- BOOKINGS table -->
  <g>
    <rect x="40" y="300" width="260" height="234" fill="#fff" stroke="#13273F" stroke-width="1.5" rx="4"/>
    <rect x="40" y="300" width="260" height="30" fill="#13273F" rx="4"/>
    <text x="170" y="320" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">bookings</text>
    <text x="52" y="348" font-size="12" fill="#333">PK  id (Integer)</text>
    <text x="52" y="366" font-size="12" fill="#333">FK  user_id → users.id</text>
    <text x="52" y="384" font-size="12" fill="#333">    trip_type (String)</text>
    <text x="52" y="402" font-size="12" fill="#333">    origin (String)</text>
    <text x="52" y="420" font-size="12" fill="#333">    destination (String)</text>
    <text x="52" y="438" font-size="12" fill="#333">    travel_date (DateTime)</text>
    <text x="52" y="456" font-size="12" fill="#333">    return_date (DateTime, null)</text>
    <text x="52" y="474" font-size="12" fill="#333">    passengers (Integer)</text>
    <text x="52" y="492" font-size="12" fill="#333">    status (String)</text>
    <text x="52" y="510" font-size="12" fill="#333">    total_price (Float)</text>
    <text x="52" y="528" font-size="12" fill="#333">    created_at (DateTime)</text>
  </g>

  <!-- PAYMENTS table -->
  <g>
    <rect x="420" y="330" width="240" height="180" fill="#fff" stroke="#D3A34E" stroke-width="1.5" rx="4"/>
    <rect x="420" y="330" width="240" height="30" fill="#D3A34E" rx="4"/>
    <text x="540" y="350" font-size="13" fill="#13273F" text-anchor="middle" font-weight="bold">payments</text>
    <text x="432" y="378" font-size="12" fill="#333">PK  id (Integer)</text>
    <text x="432" y="396" font-size="12" fill="#333">FK  booking_id → bookings.id</text>
    <text x="432" y="414" font-size="12" fill="#333">    amount (Float)</text>
    <text x="432" y="432" font-size="12" fill="#333">    status (String)</text>
    <text x="432" y="450" font-size="12" fill="#333">    payment_method (String)</text>
    <text x="432" y="468" font-size="12" fill="#333">UQ  transaction_id (String)</text>
    <text x="432" y="486" font-size="12" fill="#333">    created_at (DateTime)</text>
  </g>

  <!-- Relationships -->
  <!-- users 1 -> N bookings -->
  <path d="M150 220 L150 300" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="158" y="240" font-size="11" fill="#555">1</text>
  <text x="158" y="292" font-size="11" fill="#555">N</text>
  <text x="20" y="270" font-size="11" fill="#777">A user makes</text>
  <text x="20" y="284" font-size="11" fill="#777">many bookings</text>

  <!-- bookings 1 -> 1 payments -->
  <path d="M300 417 L420 417" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="312" y="410" font-size="11" fill="#555">1</text>
  <text x="400" y="410" font-size="11" fill="#555">1</text>
  <text x="305" y="435" font-size="11" fill="#777">Each booking has</text>
  <text x="305" y="449" font-size="11" fill="#777">one payment record</text>

  <!-- trips referenced by bookings (snapshot, not FK) -->
  <path d="M600 260 Q470 260 300 340" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,5"/>
  <text x="420" y="270" font-size="11" fill="#999">trip details snapshotted</text>
  <text x="420" y="284" font-size="11" fill="#999">into booking at time of order</text>

  <text x="20" y="20" font-size="14" fill="#13273F" font-weight="bold">Wayfare — Entity Relationship Diagram</text>
</svg>
